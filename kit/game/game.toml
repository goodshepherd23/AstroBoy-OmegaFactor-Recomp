# Astro Boy: Omega Factor (USA, BTAE).
# Hybrid configuration consumed by both gba_recompile and the runtime.

[game]
name = "Astro Boy: Omega Factor"
short_name = "astroboy_omega_factor"

[program]
name = "Astro Boy: Omega Factor (USA)"
id = "BTAE"
load_address = 0x08000000
size = 0x00800000
entry_pc = 0x08000000

[identity]
sha1 = "4d652c24979dd7a08ee683b32d1d8986a5511a87"

[bios]
path = "bios/gba_bios.bin"
sha1 = "300c20df6731a33952ded8c436f7f186d25d3492"
hle = false
skip_intro = true

[rom]
path = "roms/astroboy_omega_factor_usa.gba"
sha1 = "4d652c24979dd7a08ee683b32d1d8986a5511a87"

[save]
# ROM carries EEPROM_V124; the runtime adapts 512 B vs 8 KB from the game's
# first access width.
type = "eeprom"
size = 8192
path = "saves/astroboy_omega_factor_usa.sav"

[runtime]
debug_port = 19863
window_title = "AstroBoyRecomp"

